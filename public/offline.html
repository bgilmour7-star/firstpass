<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1416" media="(prefers-color-scheme: dark)">
<title>Offline · Firstpass</title>
<!-- Shown by the installed app when a page can't load with no signal (decision 0021). Plain HTML on
     purpose: it's served in place of other pages, so it carries no app code. Colours are the
     design-system tokens written out. -->
<style>
  :root { --surface: #FFFFFF; --ink: #0E1B1E; --ink2: #51646A; --rink: #0C6E8F; --mark: #084F68; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --surface: #0B1416; --ink: #EAF2F3; --ink2: #9FB3B8; --rink: #4FC2E0; --mark: #7AD4EC; } }
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: 'Lexend Variable', 'Lexend', system-ui, sans-serif; }
  main { min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: max(2rem, env(safe-area-inset-top)) 24px max(2rem, env(safe-area-inset-bottom)); }
  h1 { margin: 8px 0 0; font-family: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.15; }
  p { margin: 0; max-width: 32ch; font-size: 17px; line-height: 1.5; color: var(--ink2); }
  a { margin-top: 12px; display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border-radius: 9999px; background: var(--rink); color: var(--surface); font-size: 15px; font-weight: 500; text-decoration: none; }
  a:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(12, 110, 143, 0.45); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" style="color: var(--mark)"><circle cx="9.5" cy="38.5" r="6.5" fill="currentColor"/><path d="M17.5 33C21.5 30 24.5 27 27 23.5" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="4.4 3.8" stroke-linecap="round"/><path d="M31 18.5 23.06 22.62 27.47 23.35 29.53 27.32Z" fill="currentColor"/><circle cx="37.5" cy="10.5" r="7.2" fill="none" stroke="currentColor" stroke-width="4"/></svg>
  <h1>You’re offline</h1>
  <p>This page needs signal. Today’s plan is saved on this phone, so it still opens.</p>
  <a href="/today">Open today’s plan</a>
</main>
</body>
</html>
